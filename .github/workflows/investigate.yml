# This is a basic workflow that is triggered by a push

name: Investigative workflow

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  push:
    branches: [actions-investigate]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called <?>
  automate_release_updates:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    - name: Show useful information about the environment
      run: |
        echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

    - name: Check out repository code
      uses: actions/checkout@v4
      with:
        ref: vNext

    - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
    - run: echo "🖥️ The workflow is now ready to test your code on the runner."

    - name: List files in the repository
      run: |
        ls ${{ github.workspace }}
        ls ${{ github.workspace }}/ga

    - run: echo "Copying latest files to a dummy directory"
    - run: cp -r ${{ github.workspace }}/ga/latest ${{ github.workspace }}/ga/test
    - run: echo "List files in ga again"
    - run: ls ${{ github.workspace }}/ga

    #- name: Let's append to the README file.
    #  run: echo $(date) >> README.md

    - name: Commit changes
      uses: EndBug/add-and-commit@v9
      with: 
        default_author: github_actions
        author_name: GitHub Actions
        author_email: mail@example.com
        message: 'Test commit'
        add: '${{ github.workspace }}/ga/test'
        new_branch: test_branch
        push: true

    - run: echo "🍏 This job's status is ${{ job.status }}."
