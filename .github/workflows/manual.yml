# This is a basic workflow that is manually triggered

name: Manual workflow

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      name:
        # Friendly description to be shown in the UI instead of 'name'
        description: 'Enter name'
        # Default value if no value is explicitly provided
        default: 'Wendy'
        # Input has to be provided for the workflow to run
        required: false
        # The data type of the input
        type: string
      color:
        description: 'Favorite color?'
        default: 'Green'
        required: false
        type: string
      hobby:
        description: 'Hobbies?'
        default: 'Coding'
        required: false
        type: string

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called <?>
  automate_release_updates:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    - name: Greetings
      run: |
        echo "Hello, ${{ inputs.name }}""
        echo "I like ${{ inputs.color }}, too."
        echo "${{ inputs.hobby }} is fun!"
      
    - name: Show useful information about the environment
      run: |
        echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
        echo
        echo "List files"
        ls -a
        echo
        echo "Java version"
        java --version
        echo
        echo "Workspace location"
        echo $RUNNER_WORKSPACE
        echo
        echo "Who is running this?"
        whoami
        echo
        echo "Disc layout"
        df
        echo
        echo "What are the environment variables?"
        env
        echo
        echo "gh info:"
        gh --help

    - name: Check out repository code
      uses: actions/checkout@v4

    - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
    - run: echo "🖥️ The workflow is now ready to test your code on the runner."

    - name: List files in the repository
      run: |
        ls ${{ github.workspace }}

    - run: echo "🍏 This job's status is ${{ job.status }}."
